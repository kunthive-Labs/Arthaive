name: Preflight Configuration Check

on:
  workflow_dispatch:
  pull_request:
  push:
    branches: [main]

jobs:
  verify:
    name: Database, Auth & Build Readiness Check
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Verify repository secrets presence
        run: |
          echo "Checking required environment variables & secrets..."
          MISSING=0
          if [ -z "${{ secrets.DATABASE_URL }}" ]; then
            echo "::warning::DATABASE_URL secret is missing in GitHub repository secrets"
            MISSING=$((MISSING+1))
          fi
          if [ -z "${{ secrets.BETTER_AUTH_SECRET }}" ]; then
            echo "::warning::BETTER_AUTH_SECRET secret is missing in GitHub repository secrets"
          fi
          if [ $MISSING -gt 0 ]; then
            echo "::notice::Some runtime secrets are not configured in GitHub Actions secrets. Database preflight step will test against available env."
          fi

      - name: Run Database Preflight Check
        if: ${{ secrets.DATABASE_URL != '' }}
        run: npm run check-db -- --strict
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          DATABASE_SSL_CA: ${{ secrets.DATABASE_SSL_CA }}

      - name: Lint codebase
        run: npm run lint

      - name: Typecheck TypeScript
        run: npx tsc --noEmit

      - name: Run Vitest Unit Tests
        run: npm test

      - name: Verify Production Build
        run: npm run build
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          BETTER_AUTH_SECRET: ${{ secrets.BETTER_AUTH_SECRET }}
          BETTER_AUTH_URL: ${{ secrets.BETTER_AUTH_URL || 'http://localhost:3000' }}
          NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}
          NEXT_PUBLIC_SUPABASE_ANON_KEY: ${{ secrets.NEXT_PUBLIC_SUPABASE_ANON_KEY }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          GOOGLE_CLIENT_ID: ${{ secrets.GOOGLE_CLIENT_ID }}
          GOOGLE_CLIENT_SECRET: ${{ secrets.GOOGLE_CLIENT_SECRET }}
