name: CI

on:
  pull_request:
  push:
    branches: [main]

jobs:
  build:
    name: Lint, typecheck & test
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Typecheck
        run: npx tsc --noEmit

      - name: Test
        run: npm test

      # Build the same OpenNext artifact that is deployed to Workers. This also
      # invokes the regular Next.js build and the prebuild data-generation step.
      - name: Build Cloudflare Worker
        run: npm run build:cloudflare

      - name: Validate Worker bundle
        run: npx wrangler deploy --dry-run
